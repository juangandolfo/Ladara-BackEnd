components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Protected routes verify a JWT. Some middleware returns HTTP 403 with
        plain-text errors; route-specific authorization middleware can use 401.
        AuthService and auth middleware currently use different fallback JWT
        secrets when SECRET_JWT_KEY is unset, so generated tokens may not work
        on protected routes without that environment variable configured.
  parameters:
    PositiveId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
        error: { type: string }
    MessageError:
      type: object
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
    SuccessMessageResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
    AuthError:
      type: object
      properties:
        error: { type: string }
    ValidationError:
      type: object
      required: [success, errors]
      properties:
        success: { type: boolean, const: false }
        errors:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              value: {}
              msg: {}
              path: {}
              location: {}
    ValidationOrMessageError:
      oneOf:
        - $ref: "#/components/schemas/ValidationError"
        - $ref: "#/components/schemas/ErrorResponse"
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isAdmin: { type: boolean }
    ProductFilters:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        code: { type: string }
        price: { type: number }
        minPrice: { type: number, minimum: 0 }
        maxPrice: { type: number, minimum: 0 }
        stock: { type: integer }
        minStock: { type: integer, minimum: 0 }
        maxStock: { type: integer, minimum: 0 }
        category: { type: string }
        sortBy:
          type: string
          enum: [id, name, price, description, code, stock]
        sortOrder:
          type: string
          enum: [ASC, DESC]
        limit: { type: integer, minimum: 1 }
        offset: { type: integer, minimum: 0 }
        includeDeleted: { type: boolean }
    Product:
      type: object
      description: Product entity with an extra discountedPrice property on query responses.
      x-frontend-expectation: The frontend Product type also includes brand, isActive, createdAt, and updatedAt; those fields are not defined by the backend Product entity. discountedPrice is only added to query results.
      required: [id, name, price, stock, category, image]
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: number }
        description: { type: [string, "null"] }
        code: { type: [string, "null"] }
        stock: { type: integer }
        category: { type: string }
        categoryId: { type: [integer, "null"] }
        image: { type: string }
        deletedAt: { type: [string, "null"], format: date-time }
        discountedPrice: { type: number }
    CreateProduct:
      type: object
      required: [name, price, stock, category]
      properties:
        name: { type: string, minLength: 1 }
        price: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        category: { type: string, minLength: 1 }
        description: { type: string }
        code: { type: string }
        image: { type: string }
    UpdateProduct:
      type: object
      properties:
        name: { type: string }
        price: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        category: { type: string }
        description: { type: string }
        code: { type: string }
        image: { type: string }
    ProductFilterResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data, meta]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Product" }
            meta:
              type: object
              required: [total, count, appliedFilters]
              properties:
                total: { type: integer }
                count: { type: integer }
                appliedFilters: { $ref: "#/components/schemas/ProductFilters" }
    ProductDataResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/Product" }
    RecommendedProduct:
      type: object
      required: [id, name, price, stock, image, category]
      properties:
        id: { type: integer }
        name: { type: string }
        price: { type: number }
        stock: { type: integer }
        image: { type: string }
        category: { type: string }
        description: { type: [string, "null"] }
    BillingInformationInput:
      type: object
      required: [fullName, addressLine1, city, postalCode, country]
      properties:
        fullName: { type: string, maxLength: 120 }
        company: { type: [string, "null"], maxLength: 120 }
        addressLine1: { type: string, maxLength: 255 }
        addressLine2: { type: [string, "null"], maxLength: 255 }
        city: { type: string, maxLength: 120 }
        state: { type: [string, "null"], maxLength: 120 }
        postalCode: { type: string, maxLength: 32 }
        country: { type: string, maxLength: 100 }
        phone: { type: [string, "null"], maxLength: 50 }
    BillingInformation:
      allOf:
        - $ref: "#/components/schemas/BillingInformationInput"
        - type: object
          required: [id, userId, createdAt]
          properties:
            id: { type: integer }
            userId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    BillingInformationDataResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/BillingInformation" }
    OrderItem:
      type: object
      required: [id, productId, quantity, price, total]
      properties:
        id: { type: integer }
        productId: { type: integer }
        quantity: { type: integer }
        price: { type: number }
        total: { type: number }
        product:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            price: { type: number }
            stock: { type: integer }
            discountedPrice: { type: number }
            image: { type: string }
            category: { type: string }
            description: { type: string }
    Order:
      type: object
      required:
        - id
        - userId
        - status
        - total
        - shippingCost
        - createdAt
        - updatedAt
        - paymentStatus
        - paymentReference
        - paidAt
        - invoiceIdentifier
        - invoiceIssuedAt
        - isDelivered
        - deliveredAt
        - deliveryDocumentIdentifier
        - completedAt
      properties:
        id: { type: integer }
        userId: { type: string, format: uuid }
        status:
          type: string
          enum: [cart, order_placed, completed]
        total: { type: number }
        shippingCost: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        billingInformationId: { type: integer }
        billingAddress: { $ref: "#/components/schemas/BillingAddress" }
        paymentMethod: { type: string }
        checkoutAt: { type: string, format: date-time }
        paymentStatus: { type: string, enum: [unpaid, paid] }
        paymentReference: { type: [string, "null"] }
        paidAt: { type: [string, "null"], format: date-time }
        invoiceIdentifier: { type: [string, "null"] }
        invoiceIssuedAt: { type: [string, "null"], format: date-time }
        isDelivered: { type: boolean }
        deliveredAt: { type: [string, "null"], format: date-time }
        deliveryDocumentIdentifier: { type: [string, "null"] }
        completedAt: { type: [string, "null"], format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
    BillingAddress:
      type: object
      required: [fullName, addressLine1, city, postalCode, country]
      properties:
        fullName: { type: string }
        company: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string }
        phone: { type: string }
    OrderListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Order" }
    OrderDataResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/Order" }
    OrderItemResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/OrderItem" }
    CouponResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [valid, code, discountAmount]
              properties:
                valid: { type: boolean, const: true }
                code: { type: string }
                discountAmount: { type: number }
    OrderValidationResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [valid, rejectedItems]
              properties:
                valid: { type: boolean }
                rejectedItems:
                  type: array
                  items:
                    type: object
                    required: [itemId, reason, message]
                    properties:
                      itemId: { type: [integer, string] }
                      reason: { type: string, enum: [PRODUCT_NOT_FOUND, OUT_OF_STOCK, PRICE_CHANGED] }
                      message: { type: string }
    FulfillmentUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        paymentStatus: { type: string, enum: [unpaid, paid] }
        paymentReference: { type: [string, "null"], maxLength: 255 }
        invoiceIssued: { type: boolean }
        invoiceIdentifier: { type: [string, "null"], maxLength: 100 }
        isDelivered: { type: boolean }
        deliveryDocumentIdentifier: { type: [string, "null"], maxLength: 255 }
    NonNegativeMoney:
      oneOf:
        - type: number
          minimum: 0
          maximum: 99999999.99
          multipleOf: 0.01
        - type: string
          pattern: "^(?:0*[0-9]{1,7}|0*[1-9][0-9]{0,7})(\\.[0-9]{1,2})?$"
    ShippingCost:
      oneOf:
        - type: number
          minimum: 0
          maximum: 9999.99
          multipleOf: 0.01
        - type: string
          pattern: "^(?:0*[0-9]{1,3}|0*[1-9][0-9]{0,3})(\\.[0-9]{1,2})?$"
    SettingResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [key, value]
              properties:
                key: { type: string }
                value: { type: [number, string, "null"] }
    DashboardData:
      type: object
      required: [period, sales, revenueByDay, monthlyTarget, categorySales, activeUsersByCountry, recentActivity]
      properties:
        period:
          type: object
          required: [from, to, timezone]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            timezone: { type: string }
        sales:
          type: object
          required: [currency, confirmedRevenue, paidOrderCount]
          properties:
            currency: { type: string, const: UYU }
            confirmedRevenue: { type: number }
            paidOrderCount: { type: integer }
        revenueByDay:
          type: array
          items:
            type: object
            required: [date, revenue, paidOrderCount]
            properties:
              date: { type: string, format: date }
              revenue: { type: number }
              paidOrderCount: { type: integer }
        monthlyTarget:
          type: object
          required: [amount, achievedAmount, completionPercent]
          properties:
            amount: { type: [number, "null"] }
            achievedAmount: { type: number }
            completionPercent: { type: [number, "null"] }
        categorySales:
          type: array
          items:
            type: object
            required: [categoryId, categoryName, revenue, unitsSold, sharePercent]
            properties:
              categoryId: { type: integer }
              categoryName: { type: string }
              revenue: { type: number }
              unitsSold: { type: integer }
              sharePercent: { type: number }
        activeUsersByCountry:
          type: array
          items:
            type: object
            required: [country, userCount, sharePercent]
            properties:
              country: { type: [string, "null"] }
              userCount: { type: integer }
              sharePercent: { type: number }
        recentActivity:
          type: array
          items:
            type: object
            required: [id, type, description, createdAt, actorName]
            properties:
              id: { type: string }
              type: { type: string }
              description: { type: string }
              createdAt: { type: string, format: date-time }
              actorName: { type: [string, "null"] }
    Discount:
      type: object
      properties:
        id: { type: integer }
        user: { $ref: "#/components/schemas/User" }
        value: { type: number }
        type: { type: string, enum: [fixed, percent] }
        description: { type: [string, "null"] }
        usesLeft: { type: [integer, "null"] }
        deletedAt: { type: [string, "null"], format: date-time }
    DiscountInput:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        value: { type: number }
        type: { type: string, enum: [fixed, percent] }
        description: { type: [string, "null"] }
        usesLeft: { type: [integer, "null"] }
    DiscountListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Discount" }
    DiscountDataResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/Discount" }
