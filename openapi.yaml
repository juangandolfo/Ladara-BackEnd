openapi: 3.1.0
info:
  title: Ladara backend API
  version: 1.0.0
  description: |
    Contract for the routes registered by the backend on the dev branch. Paths,
    authentication, request validation, response bodies, and status codes are
    based on the route, middleware, controller, and DTO implementations. This
    describes current behavior, not a promise that the behavior is stable.

    Frontend expectations from the separate frontend contract are called out
    with x-frontend-expectation where they differ from or are not established
    by the server implementation. Those extensions are not server guarantees.
    No product-by-id route is registered.
servers:
  - url: http://localhost:3000
    description: Default local server; the listening port can be overridden with PORT.
tags:
  - name: Authentication
  - name: Products
  - name: Orders
  - name: Billing information
  - name: Business settings
  - name: Analytics
  - name: Discounts
paths:
  /auth/google:
    get:
      tags: [Authentication]
      summary: Start Google OAuth
      description: Redirects the browser to Google for profile and email authorization.
      responses:
        "302":
          description: Redirect to Google OAuth.
        default:
          description: Passport or OAuth provider response.
  /auth/google/callback:
    get:
      tags: [Authentication]
      summary: Handle Google OAuth callback
      description: |
        On success, returns HTML that posts `{ user, token }` to `window.opener`
        and closes the popup. The `origin` query value is used as the
        postMessage target origin; the default is `*`. The user object comes
        from the backend User entity (`id`, `name`, and `isAdmin`).
      x-frontend-expectation: The frontend AppUser type permits an email field, but the backend User entity does not define one.
      parameters:
        - name: origin
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: HTML popup callback response.
          content:
            text/html:
              schema: { type: string }
        "302":
          description: OAuth failure redirect to `/`.
        "500":
          description: Callback processing error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the authenticated user
      description: Verifies the supplied token and returns the user record.
      x-frontend-expectation: The frontend AppUser type permits an email field, but the backend User entity does not define one.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User was found for the token.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401":
          description: Authorization header or token is missing or invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthError" }
        "500":
          description: User lookup failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthError" }
  /api/products/query:
    get:
      tags: [Products]
      summary: Query products
      description: |
        Public route. The implementation accepts product filter query
        parameters and returns product entity data with a `discountedPrice`
        value. Some filter properties are consumed by the service but are not
        covered by request validators.
      x-frontend-expectation: The frontend sends an Authorization header, possibly `Bearer null`; the route does not require authentication.
      parameters:
        - name: id
          in: query
          schema: { type: integer }
        - name: name
          in: query
          schema: { type: string }
        - name: description
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: price
          in: query
          schema: { type: number }
        - name: minPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: maxPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: stock
          in: query
          schema: { type: integer }
        - name: minStock
          in: query
          schema: { type: integer, minimum: 0 }
        - name: maxStock
          in: query
          schema: { type: integer, minimum: 0 }
        - name: category
          in: query
          schema: { type: string }
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [id, name, price, description, code, stock]
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
        - name: includeDeleted
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Filtered products and paging metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductFilterResponse" }
        "400":
          description: Invalid validated filter or an inverted min/max range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationOrMessageError" }
        "500":
          description: Product filtering failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/products/filter:
    post:
      tags: [Products]
      summary: Query products with a JSON filter
      description: |
        Public route. The controller reads the filter object from the request
        body. The route's Express validators inspect query parameters instead
        of the body, so body fields are not validated by those validators.
      x-frontend-expectation: Frontend filter payload fields are client expectations; server-side body validation is not established by this route.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductFilters" }
      responses:
        "200":
          description: Filtered products and paging metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductFilterResponse" }
        "400":
          description: Invalid validated query parameter or an inverted min/max range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationOrMessageError" }
        "500":
          description: Product filtering failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/products/categories:
    get:
      tags: [Products]
      summary: List product categories
      description: Public route returning distinct category names.
      x-frontend-expectation: The frontend sends an Authorization header, possibly `Bearer null`; the route does not require authentication.
      responses:
        "200":
          description: Category names.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { type: string }
                      count: { type: integer }
        "500":
          description: Category lookup failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/products:
    get:
      tags: [Products]
      summary: List products
      description: Returns all non-deleted products. Admin only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Product list and count.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Product" }
                      count: { type: integer }
        "403":
          description: Invalid/missing token (plain text) or non-admin user (JSON).
        "500":
          description: Product lookup failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      tags: [Products]
      summary: Create a product
      description: Admin only. Category is resolved or created by its name.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProduct" }
      responses:
        "201":
          description: Product created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDataResponse" }
        "400":
          description: Request validation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "403":
          description: Invalid/missing token (plain text) or non-admin user (JSON).
        "500":
          description: Product creation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/products/deleted:
    get:
      tags: [Products]
      summary: List deleted products
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deleted products and count.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Product" }
                      count: { type: integer }
        "403":
          description: Invalid/missing token (plain text) or non-admin user (JSON).
        "500":
          description: Product lookup failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/products/{id}:
    put:
      tags: [Products]
      summary: Update a product
      description: Admin only. Supplied fields are updated; category names are resolved or created.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PositiveId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProduct" }
      responses:
        "200":
          description: Updated product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDataResponse" }
        "400":
          description: Invalid product ID or request validation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationOrMessageError" }
        "403":
          description: Invalid/missing token (plain text) or non-admin user (JSON).
        "404":
          description: Product not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Product update failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [Products]
      summary: Soft-delete a product
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PositiveId"
      responses:
        "200":
          description: Product soft-deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "400":
          description: Invalid product ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationOrMessageError" }
        "403":
          description: Invalid/missing token (plain text) or non-admin user (JSON).
        "404":
          description: Product not found or already deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Product deletion failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/products/{id}/restore:
    post:
      tags: [Products]
      summary: Restore a deleted product
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PositiveId"
      responses:
        "200":
          description: Product restored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "400":
          description: Invalid product ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationOrMessageError" }
        "403":
          description: Invalid/missing token (plain text) or non-admin user (JSON).
        "404":
          description: Product not found or not deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Product restore failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/products/{id}/permanent:
    delete:
      tags: [Products]
      summary: Permanently delete a product
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PositiveId"
      responses:
        "200":
          description: Product permanently deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "400":
          description: Invalid product ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationOrMessageError" }
        "403":
          description: Invalid/missing token (plain text) or non-admin user (JSON).
        "404":
          description: Product not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: Permanent deletion failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/orders/checkout:
    get:
      tags: [Orders]
      summary: Serve checkout page
      description: Public endpoint serving the checkout HTML page.
      responses:
        "200":
          description: Checkout HTML page.
          content:
            text/html:
              schema: { type: string }
  /api/orders/recommendations:
    get:
      tags: [Orders]
      summary: List recommended products
      description: Returns up to 12 products in ascending ID order.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 4, maximum: 12 }
      responses:
        "200":
          description: Recommended products.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/RecommendedProduct" }
        "500":
          description: Recommendation lookup failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/orders/current:
    get:
      tags: [Orders]
      summary: Get or create the current cart
      x-frontend-expectation: The frontend accepts either an object or array in `data`; this implementation always returns an array.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current cart, wrapped in a one-element array.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderListResponse" }
        "403":
          description: Invalid/missing bearer token (plain text).
        "500":
          description: Cart lookup or creation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/orders/current/items:
    delete:
      tags: [Orders]
      summary: Clear the current cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cart cleared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "401":
          description: Invalid/missing bearer token (plain text) or unauthenticated user (JSON).
        "500":
          description: Cart clearing failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/orders/admin:
    get:
      tags: [Orders]
      summary: List all orders
      description: Admin only; returns orders in newest-first order.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Orders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderListResponse" }
        "403":
          description: Invalid/missing token (plain text) or non-admin user (JSON).
        "500":
          description: Order lookup failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/orders/admin/dashboard-summary:
    get:
      tags: [Orders]
      summary: Get order dashboard summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Counts of carts, placed orders, and recently completed orders.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [cartCount, orderPlacedCount, completedLast30DaysCount]
                    properties:
                      cartCount: { type: integer }
                      orderPlacedCount: { type: integer }
                      completedLast30DaysCount: { type: integer }
        "403":
          description: Invalid/missing token (plain text) or non-admin user (JSON).
        "500":
          description: Summary lookup failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/orders:
    get:
      tags: [Orders]
      summary: List the current user's non-cart orders
      x-frontend-expectation: Frontend order/history declarations differ; the server serializes its OrderDto shape and returns 404 when there are no non-cart orders.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User orders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderListResponse" }
        "403":
          description: Invalid/missing bearer token (plain text).
        "404":
          description: The user has no non-cart orders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "500":
          description: Order lookup failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/orders/coupons/validate:
    post:
      tags: [Orders]
      summary: Validate a coupon
      description: Accepts codes matching `SAVE` followed by one or two digits.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Coupon accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CouponResponse" }
        "400":
          description: Missing or invalid coupon code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "403":
          description: Invalid/missing bearer token (plain text).
        "500":
          description: Coupon validation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/orders/{id}/validate:
    post:
      tags: [Orders]
      summary: Validate items and prices in an order
      description: |
        Order owner only. A validation result with rejected items is returned
        with HTTP 200 and `success: false`; it is not an HTTP error.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PositiveId"
      responses:
        "200":
          description: Stock and price validation result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderValidationResponse" }
        "400":
          description: Invalid order ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "403":
          description: Invalid/missing token or order belongs to another user.
        "404":
          description: Order not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "500":
          description: Order validation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/orders/{id}/items:
    post:
      tags: [Orders]
      summary: Add an item to an order
      description: Order owner only. Existing matching items have their quantity increased.
      x-frontend-expectation: The frontend contract mentions an `item` property, but this implementation returns the created item under `data`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PositiveId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity]
              properties:
                productId: { type: integer, minimum: 1 }
                quantity: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Item added or merged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderItemResponse" }
        "400":
          description: Invalid order ID or request validation failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "403":
          description: Invalid/missing token or order belongs to another user.
        "404":
          description: Order or product not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "500":
          description: Item addition failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/orders/{id}/checkout:
    post:
      tags: [Orders]
      summary: Save checkout details and place an order
      description: |
        Order owner only. Checkout records an existing billing-information
        record and a payment method; it does not process a payment.
      x-frontend-expectation: "The frontend contract describes a `billingAddress` object and `paymentMethod: pending`; the server instead requires `billingInformationId` and `paymentMethod` equal to `bank_transfer` or `cash`."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PositiveId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [billingInformationId, paymentMethod]
              properties:
                billingInformationId: { type: integer, minimum: 1 }
                paymentMethod:
                  type: string
                  enum: [bank_transfer, cash]
      responses:
        "201":
          description: Checkout details saved; payment was not processed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDataResponse" }
        "400":
          description: Invalid order ID, request validation error, empty cart, or unsupported payment method.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationOrMessageError" }
        "403":
          description: Invalid/missing token or order belongs to another user.
        "404":
          description: Order or user's billing-information record not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "409":
          description: Order is no longer in the cart state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "500":
          description: Checkout failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/orders/items/{itemId}:
    put:
      tags: [Orders]
      summary: Set an order item's quantity
      description: |
        Requires a valid user token. The current middleware does not verify
        that the item belongs to that user. A quantity of zero removes it.
      x-implementation-warning: Item ownership is not checked by the current route.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Quantity updated or item removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderItemResponse" }
        "400":
          description: Invalid item ID or quantity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationOrMessageError" }
        "403":
          description: Invalid/missing bearer token (plain text).
        "404":
          description: Order item not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "500":
          description: Item update failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      tags: [Orders]
      summary: Decrease an order item's quantity by one
      description: |
        Requires a valid user token. Removes the item when its quantity reaches
        zero. The current middleware does not verify item ownership.
      x-implementation-warning: Item ownership is not checked by the current route.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Quantity decreased or item removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessEnvelope" }
        "400":
          description: Invalid item ID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "403":
          description: Invalid/missing bearer token (plain text).
        "404":
          description: Order item not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "500":
          description: Item deletion failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/orders/{id}/fulfillment:
    patch:
      tags: [Orders]
      summary: Update order fulfillment
      description: Admin only. Supply one or more fulfillment fields; omitted values remain unchanged.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PositiveId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FulfillmentUpdate" }
      responses:
        "200":
          description: Updated order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDataResponse" }
        "400":
          description: Invalid order ID, empty body, unsupported field, or invalid field value.
          content:
